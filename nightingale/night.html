<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://d3js.org/d3.v7.min.js"></script>

    <title>Nightingale Rose Chart</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        span {
            color: tomato;
        }

        #playground {
            width: 100%;
            border: 1px solid #ccc;
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>

<body>

<h1>D3 JS</h1>

<div id="playground"></div>

<script>

d3.select("h1")
    .append("span")
    .text(" Playground");

const width = 700;
const height = 700;
const margin = 60;

// Create SVG
const svg = d3.select("#playground")
    .append("svg")
    .attr("width", width)
    .attr("height", height);

// Title
svg.append("text")
    .attr("x", width / 2)
    .attr("y", 30)
    .attr("text-anchor", "middle")
    .attr("font-size", "22px")
    .attr("font-weight", "bold")
    .text("Nightingale Rose Chart - Deaths per Month");

// Group centered in SVG
const chart = svg.append("g")
    .attr("transform", `translate(${width/2},${height/2})`);

d3.csv("data_NightingaleRoseChart.csv").then(data => {

    // Convert numeric values
    data.forEach(d => {
        d.Month = d.Month.trim();
        d.Deaths = +d.Deaths;
    });

    console.log(data);

    const maxValue = d3.max(data, d => d.Deaths);

    // Angle scale
    const angleScale = d3.scaleBand()
        .domain(data.map(d => d.Month))
        .range([0, 2 * Math.PI])
        .align(0);

    // Radius scale (Correct)
    const radiusScale = d3.scaleLinear()
        .domain([0, maxValue])
        .range([0, 250]);

    // Arc generator
    const arc = d3.arc()
        .innerRadius(0)
        .outerRadius(d => radiusScale(d.Deaths))
        .startAngle(d => angleScale(d.Month))
        .endAngle(d => angleScale(d.Month) + angleScale.bandwidth())
        .padAngle(0.02)
        .padRadius(0);

    // Draw slices
    chart.selectAll("path")
        .data(data)
        .enter()
        .append("path")
        .attr("d", arc)
        .attr("fill", (d, i) => d3.schemeTableau10[i % 10])
        .attr("stroke", "white")
        .attr("stroke-width", 2);

    // Labels
    // chart.selectAll("text.month")
    //     .data(data)
    //     .enter()
    //     .append("text")
    //     .attr("class", "month")
    //     .attr("transform", d => {

    //         const angle = angleScale(d.Month) + angleScale.bandwidth()/2 - Math.PI/2;

    //         const r = radiusScale(d.Deaths) + 20;

    //         const x = Math.cos(angle) * r;
    //         const y = Math.sin(angle) * r;

    //         return `translate(${x},${y})`;
    //     })
    //     .attr("text-anchor", "middle")
    //     .attr("font-size", "12px")
    //     .text(d => d.Month);

chart.selectAll("text")
        .data(data)
        .enter()
        .append("text")
  
        .attr("transform", d => {
            const angle = angleScale(d.Month) + angleScale.bandwidth()/2 * (radiusScale(maxValue)) +20;
            const r = radiusScale(d.Deaths) + 20;
            const x = Math.cos(angle) * r;
            const y = Math.sin(angle) * r;
            return `translate(${x},${y})`;
        })
        .attr("text-anchor", "middle")
        .attr("font-size", "12px")
        .text(d => d.Month);

        const tooltip = d3.select('body')
        .append("div")
        .attr("class", "tooltip")
        .style("position", "absolute")
        .style("background", "#f9f9f9")
        .style("padding", "5px")
        .style("border", "1px solid #ccc")
        .style("border-radius", "4px")
    .style("box-shadow", "0px 2px 8px rgba(0, 0, 0, 0.2)")
   .style('visibility', 'hidden');







});

</script>

</body>
</html>
